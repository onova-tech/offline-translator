[versions]
# The app's own speech (spec 082 research R1): sherpa-onnx's Android library, from its GitHub release (settings.gradle.kts)
sherpaOnnx = "1.13.8"
# Toolchain (research.md R1) - verified 2026-10-20
kotlin = "2.4.21"
agp = "9.4.1"
compileSdk = "37"
targetSdk = "36"
minSdk = "26"
jvmTarget = "17"

# Libraries (research.md R3)
compose-multiplatform = "1.12.2"
compose-material3 = "1.9.0"
androidx-compose = "1.12.1"
androidx-navigation3 = "1.2.0"
androidx-lifecycle = "2.11.0"
jetbrains-lifecycle = "2.11.0"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.18.0"
koin = "4.2.2"
datastore = "1.2.1"
okio = "3.18.2"
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
# Calendar dates for the daily usage count (spec 002 research.md R5)
kotlinx-datetime = "0.8.0"

# Ads and consent, only in core/monetization/ads (spec 002 research.md R1, R2) - verified 2026-10-21
ads-mobile-sdk = "1.5.0"
user-messaging-platform = "4.0.0"
# The ads SDK needs WorkManager; declared so it is current and starts on demand (spec 002 R7)
androidx-work = "2.12.0"
# Language packs through Google Play on-demand delivery, only in core/content (spec 012 research R5) - verified 2026-11-17
play-asset-delivery = "2.3.0"
# The Open-source licenses page, collected at build time (spec 012 research R4) - verified 2026-11-17
aboutlibraries = "15.3.0"

# Everyday utilities (spec 004 research.md R2, R9, R15) - verified 2026-10-22
bignum = "0.3.10"
room3 = "3.0.3"
ksp = "2.3.12"
androidx-sqlite = "2.7.1"

# Camera and barcodes (spec 006 research.md R1, R5, R6); not camera-compose, not 1.7.0-rc (R5)
camerax = "1.6.2"
zxing = "3.5.4"

# Quality and testing (research.md R14, R15)
detekt = "1.23.8"
compose-rules = "0.4.28"
ktlint = "1.8.0"
kover = "0.9.11"
konsist = "0.18.1"
robolectric = "4.17"
roborazzi = "1.76.0"
turbine = "1.2.1"
junit4 = "4.13.2"
junit-jupiter = "6.1.3"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-uiautomator = "2.4.1"

[libraries]
# bundletool's own command line for scripts/ci.sh's local testing install (spec 012 T042): AGP's version.
bundletool = { module = "com.android.tools.build:bundletool", version = "1.18.3" }
# bundletool's library jar leaves the Kotlin standard library to its host (AGP); its install-apks needs it.
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrains-lifecycle" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrains-lifecycle" }

# AndroidX (Android-only modules)
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose" }
androidx-compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility", version.ref = "androidx-compose" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }

# DI, persistence, kotlinx
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "datastore" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Ads and consent (network-allowed module only)
ads-mobile-sdk = { module = "com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk", version.ref = "ads-mobile-sdk" }
user-messaging-platform = { module = "com.google.android.ump:user-messaging-platform", version.ref = "user-messaging-platform" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }

# Language packs (network-allowed core/content only)
play-asset-delivery-ktx = { module = "com.google.android.play:asset-delivery-ktx", version.ref = "play-asset-delivery" }
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }

# Everyday utilities (spec 004)
bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }

# Camera and barcodes (spec 006)
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# Testing
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

# Quality tools (resolved in dedicated configurations of the root project)
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }
